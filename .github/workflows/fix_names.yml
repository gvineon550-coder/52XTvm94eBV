name: Fix Names and EPG

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: iptv-global
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fixer
        run: python scripts/fix_names_and_epg.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix names and EPG $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
