name: Cleanup Repo

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: iptv-cleanup-repo
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Run cleanup
        run: python scripts/cleanup_repo.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Cleanup repo $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
