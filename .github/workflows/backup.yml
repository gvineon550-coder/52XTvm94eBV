name: Backup to Mirror

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add mirror https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/gvineon550-coder/backup.git
          git push mirror HEAD:main --force

      - name: Done
        run: echo "Backup complete at $(date -u +'%Y-%m-%d %H:%M UTC')"
